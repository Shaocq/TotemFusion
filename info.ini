name = TotemFusion
displayName = 图腾合成-限制版
description = 在制作台新增「图腾合成」与「图腾词条去除」两个功能：把两个图腾合成一个，相同属性数值相加（+1 与 +2 → +3），自动合并原版词缀、Diablo2Totem 词缀与效果、自定义变量，名字按 +N 递增；也可以花钱去掉图腾上不需要的词条。已针对 Diablo2Totem 做兼容与存档修复。需要前置 HarmonyLib（工坊 3589088839），请将前置置于本 mod 之前加载。限制合成过的图腾不能再次参与合成。
version = 1.0.1
tags = Quality of Life, Gameplay
